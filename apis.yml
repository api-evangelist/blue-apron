description: 'Blue Apron is a direct-to-consumer meal-kit and prepared-food delivery company that ships
  chef-designed recipes with pre-portioned fresh ingredients on a weekly, no-commitment basis. Its
  consumer-facing surface spans meal kits, assembly-and-bake meals, ready-to-eat prepared dishes, and
  family-style options ordered and managed through blueapron.com and its mobile apps. Surfaced as a
  portfolio company of bessemer-venture-partners, Blue Apron operates a consumer e-commerce and
  subscription platform with no public developer program, API portal, or documented API surface at the
  time of enrichment.'
